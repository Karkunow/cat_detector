# Phase A placeholders — will be tuned from calibration dump output (see PLAN.md).

sample_fps: 4          # how many frames per second to sample from each clip.
# Raised from 2 after a live miss (a cat visible for only ~0.3s slipped between
# 2fps samples) and after switching to a persistent RTSP connection made extra
# samples cheap (no longer paying per-event connection latency).
yolo_confidence: 0.4

# ROI = litter box entrance area, as fractions [x1, y1, x2, y2] of frame width/height.
# Calibrated from data/calibration crops: camera is mounted right at the box entrance,
# so "inside" events have the cat's bbox center roughly in the right/upper-middle of
# frame; "passby" events (cat brushing the lens on the way elsewhere, or lounging in
# the bottom corners) sit outside this band. See PLAN.md / README for known edge cases.
roi: [0.30, 0.05, 1.00, 0.65]

min_dwell_seconds: 12
dwell_gap_tolerance_seconds: 30.0
# Raised from 2.0: this litter box is an enclosed dome, so a cat genuinely
# inside using it is mostly invisible to the camera (only visible briefly at
# the entrance). User confirmed real litter box visits (with elimination) got
# classified as passby, not visits -- the old 2s tolerance meant the dwell
# tracker's progress stalled during the long invisible stretch of real usage.
# 30s assumes: once the cat is seen entering the ROI, it's still "in the box"
# even if undetected for a while, unless the gap is implausibly long.

# If the camera's ONVIF motion state flickers off/on again within this many
# seconds, main.py treats it as still the same logical event instead of
# finalizing/classifying the fragment early. Observed live: one continuous cat
# presence split into several sub-threshold "Motion started/stopped" pairs a
# few seconds apart, each never reaching min_dwell_seconds on its own.
motion_coalesce_gap_seconds: 5.0
# Raised from 3.0 -- observed live gaps between fragments of one continuous
# cat presence around 5-8s, wider than the initial guess.

# Known cosmetic issue (not fixed): dark leather furniture at the far-left frame
# edge gets misdetected as "person" at ~0.4-0.46 confidence, which can occasionally
# tip a passby event into being mislabeled "human" instead of a cat color. Tried an
# ignore_zone and a raised person-confidence threshold; both would also cut real cat
# and real human detections that fall in the same region/confidence range, so
# rejected. Doesn't affect confirmed-visit classification (dwell check runs first,
# before the human/passby branch), only the secondary passby notification. See git
# history around 2026-07-31 for the investigation.

# Mean grayscale brightness (0-255) of the YOLO-cropped cat region, calibrated from
# median brightness per sample clip (day: black~79 vs white~124; night: black~54 vs
# white~173). Gap between black_max/white_min is a deliberate "unknown" buffer.
thresholds:
  day:
    white_min: 100
    black_max: 90
  night:
    white_min: 150
    black_max: 135

